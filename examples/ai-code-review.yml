name: AI Code Review

# 稳定启动入口 v1：复制一次；后续功能升级只更新工具仓库，不再修改本文件。
# 非密钥配置在业务仓库/组织 Actions Variables 中修改，密钥只放 Secrets。
env:
  AI_REVIEW_BLOCK_ON_RISK: ${{ vars.AI_REVIEW_BLOCK_ON_RISK || 'false' }}  # true：明确问题阻断；建议/待确认不阻断
  AI_REVIEW_DINGTALK_WEBHOOK: ${{ secrets.AI_REVIEW_DINGTALK_WEBHOOK }}  # 默认机器人；不填其他地址，禁止明文；Secret 缺失则不通知
  AI_REVIEW_NOTIFY_LEVEL: ${{ vars.AI_REVIEW_NOTIFY_LEVEL || 'all' }}  # all：问题/建议/待确认均通知；low/medium/high：明确问题达到该级别才通知，不影响阻断
  AI_REVIEW_DINGTALK_KEYWORD: ${{ vars.AI_REVIEW_DINGTALK_KEYWORD || 'gitea' }}  # 机器人安全关键词
  AI_REVIEW_TOOL_REF: ${{ vars.AI_REVIEW_TOOL_REF || 'main' }}  # 默认自动更新；可在后台改为不可变标签回退/锁定
  AI_REVIEW_MAX_BATCHES: ${{ vars.AI_REVIEW_MAX_BATCHES || '20' }}  # 最多审查批数，允许1–200；调大会增加调用费用和时间
  AI_REVIEW_MAX_FILES: ${{ vars.AI_REVIEW_MAX_FILES || '300' }}  # 最多考虑文件数，允许1–5000
  AI_REVIEW_BATCH_BYTES: ${{ vars.AI_REVIEW_BATCH_BYTES || '100000' }}  # 单批差异字节数，默认100KB；允许1000–1000000
  AI_REVIEW_INPUT_BYTES: ${{ vars.AI_REVIEW_INPUT_BYTES || '160000' }}  # 单次输入总字节预算（含规范/提示），默认160KB；不是token数，按模型额度调整，允许10000–2000000
  AI_REVIEW_OPTIONS_JSON: ${{ vars.AI_REVIEW_OPTIONS_JSON }}  # 可选：非密钥扩展配置 JSON，显式值覆盖上述单项配置
# 密钥名称、run.py 入口、has_risk 输出和最后策略步骤是稳定接口，不要随意删除。

on:
  push:
    branches: ['**']
  workflow_dispatch:

jobs:
  review:
    name: AI 代码风险审查
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: 检查 OpenAI 密钥开关
        id: config
        shell: bash
        env:
          AI_REVIEW_OPENAI_API_KEY: ${{ secrets.AI_REVIEW_OPENAI_API_KEY }}
        run: |
          if [[ -n "${AI_REVIEW_OPENAI_API_KEY//[[:space:]]/}" ]]; then
            echo 'enabled=true' >> "$GITHUB_OUTPUT"
          else
            echo 'enabled=false' >> "$GITHUB_OUTPUT"
            echo '未配置 OpenAI 密钥，跳过 AI Code Review（不会调用 Claude）。'
          fi

      - name: 检出待审业务仓库
        if: steps.config.outputs.enabled == 'true'
        continue-on-error: true
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      # 审查器放在 runner 临时目录，不覆盖业务仓库、不纳入审查 diff。
      - name: 拉取独立审查器
        if: steps.config.outputs.enabled == 'true'
        continue-on-error: true
        shell: bash
        env:
          AI_REVIEW_TOOL_TOKEN: ${{ secrets.AI_REVIEW_TOOL_READ_TOKEN || gitea.token }}
        run: |
          set -euo pipefail
          tool_dir="$(mktemp -d "$RUNNER_TEMP/ai-code-review.XXXXXX")"
          # 凭据仅通过临时 askpass 注入，不嵌入 URL 或写入 Git 配置。
          askpass="$(mktemp "$RUNNER_TEMP/ai-review-askpass.XXXXXX")"
          trap 'rm -f "$askpass"' EXIT
          printf '%s\n' '#!/bin/sh' 'case "$1" in *Username*) echo x-access-token;; *) printf "%s\\n" "$AI_REVIEW_TOOL_TOKEN";; esac' > "$askpass"
          chmod 700 "$askpass"
          GIT_ASKPASS="$askpass" GIT_TERMINAL_PROMPT=0 git clone --quiet --depth 1 --branch "$AI_REVIEW_TOOL_REF" \
            https://gitea.adesk.com/actions/ai-code-review.git "$tool_dir"
          echo "AI_REVIEW_TOOL_DIR=$tool_dir" >> "$GITHUB_ENV"
          echo "审查器版本：$(git -C "$tool_dir" rev-parse HEAD)"

      - name: 生成中文风险报告
        id: review
        if: steps.config.outputs.enabled == 'true'
        continue-on-error: true
        shell: bash
        env:
          AI_REVIEW_OPENAI_API_KEY: ${{ secrets.AI_REVIEW_OPENAI_API_KEY }}
          AI_REVIEW_OPENAI_BASE_URL: ${{ vars.AI_REVIEW_OPENAI_BASE_URL }}
          AI_REVIEW_OPENAI_MODEL: ${{ vars.AI_REVIEW_OPENAI_MODEL }}
          AI_REVIEW_CLAUDE_API_KEY: ${{ secrets.AI_REVIEW_CLAUDE_API_KEY }}
          AI_REVIEW_CLAUDE_BASE_URL: ${{ vars.AI_REVIEW_CLAUDE_BASE_URL }}
          AI_REVIEW_CLAUDE_MODEL: ${{ vars.AI_REVIEW_CLAUDE_MODEL }}
          AI_REVIEW_DEFER_NOTIFY: 'true'  # 报告上传成功后才发送产物链接
          AI_REVIEW_REPOSITORY: ${{ gitea.repository }}
          AI_REVIEW_RUN_URL: ${{ gitea.server_url }}/${{ gitea.repository }}/actions/runs/${{ gitea.run_id }}
          AI_REVIEW_BEFORE: ${{ gitea.event.before }}
          AI_REVIEW_AFTER: ${{ gitea.sha }}
        run: |
          if [[ -z "${AI_REVIEW_TOOL_DIR:-}" ]]; then
            echo '审查未完成：独立审查器拉取失败。'
          elif command -v python3 >/dev/null 2>&1 && python3 -c 'import sys; sys.exit(sys.version_info < (3, 10))'; then
            python3 -I "$AI_REVIEW_TOOL_DIR/run.py"
          else
            echo '审查未完成：runner 未安装 Python 3（需要 3.10+），未调用 AI。'
          fi

      - name: 上传审查报告产物
        id: artifact
        if: steps.config.outputs.enabled == 'true'
        continue-on-error: true
        uses: actions/upload-artifact@v3
        with:
          name: ai-code-review-report-${{ gitea.run_attempt }}
          path: ${{ runner.temp }}/ai-code-review-report/
          if-no-files-found: error
          retention-days: 30

      - name: 发送审查摘要与产物链接
        if: steps.artifact.outcome == 'success' && steps.review.outputs.should_notify == 'true'
        continue-on-error: true
        shell: bash
        env:
          AI_REVIEW_REPOSITORY: ${{ gitea.repository }}
          AI_REVIEW_AFTER: ${{ gitea.sha }}
          AI_REVIEW_SHOULD_NOTIFY: ${{ steps.review.outputs.should_notify }}
          AI_REVIEW_RUN_URL: ${{ gitea.server_url }}/${{ gitea.repository }}/actions/runs/${{ gitea.run_id }}/artifacts/ai-code-review-report-${{ gitea.run_attempt }}?attempt=${{ gitea.run_attempt }}
        run: python3 -I "$AI_REVIEW_TOOL_DIR/artifact_link.py"

      # 不使用 job 级 continue-on-error，否则启用阻断也会被吞掉。
      - name: 应用风险阻断策略
        shell: bash
        env:
          AI_REVIEW_HAS_RISK: ${{ steps.review.outputs.has_risk }}
        run: |
          if [[ -n "${AI_REVIEW_TOOL_DIR:-}" ]] && command -v python3 >/dev/null 2>&1 && python3 -c 'import sys; sys.exit(sys.version_info < (3, 10))'; then
            python3 -I "$AI_REVIEW_TOOL_DIR/run.py" --policy
          else
            echo '审查未完成：工具或 Python 不可用，未执行风险策略；不代表安全。'
          fi
